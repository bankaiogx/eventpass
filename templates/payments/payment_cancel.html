{% extends "base.html" %}

{% block title %}Payment Cancelled | EventPass{% endblock %}

{% block content %}
<section class="auth-card">
    <h1>Payment Cancelled</h1>
    <p class="text-muted">Your payment for {{ order.event.title }} was not completed.</p>

    <p class="mb-1">Order #{{ order.id }}</p>
    <p>Status: {{ order.get_payment_status_display }}</p>

    <a class="btn btn-danger w-100 mb-2" href="{% url 'booking_confirmation' order.id %}">Try Again</a>
    <a class="btn btn-outline-secondary w-100" href="{% url 'event_list' %}">Browse Events</a>
</section>
{% endblock %}
