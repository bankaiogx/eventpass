{% extends "base.html" %}

{% block title %}Login | EventPass{% endblock %}

{% block content %}
<!-- Login form card. -->
<section class="auth-card">
    <h1>Log in</h1>
    <p class="text-muted">Log in to access your account.</p>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
            {{ form.username }}
        </div>
        <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}
        </div>
        <button class="btn btn-danger w-100" type="submit">Login</button>
    </form>

    <p class="auth-link">Need an account? <a href="{% url 'register' %}">Register</a></p>
</section>
{% endblock %}
