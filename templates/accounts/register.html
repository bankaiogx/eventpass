{% extends "base.html" %}

{% block title %}Register | EventPass{% endblock %}

{% block content %}
<section class="auth-card">
    <h1>Create account</h1>
    <p class="text-muted">Create an account so tickets can be linked to your profile.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-danger w-100" type="submit">Register</button>
    </form>

    <p class="auth-link">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</section>
{% endblock %}
