{% extends "base.html" %}

{% block title %}Something Went Wrong | EventPass{% endblock %}

{% block content %}
<section class="auth-card payment-result">
    <div class="payment-icon cancelled">
        <i class="bi bi-exclamation-triangle"></i>
    </div>
    <h1>Something Went Wrong</h1>
    <p class="text-muted">There was a problem loading this page.</p>
    <p class="text-muted">Please try again or return to the events page.</p>

    <a class="btn btn-danger w-100 mb-2" href="{% url 'event_list' %}">Browse Events</a>
    <a class="btn btn-dark w-100" href="{% url 'home' %}">Back Home</a>
</section>
{% endblock %}
